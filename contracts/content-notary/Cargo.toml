[package]
name = "serller-content-notary"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "27.0.5"

[dev-dependencies]
soroban-sdk = { version = "27.0.5", features = ["testutils"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
overflow-checks = true

[workspace]
